name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vanika
          POSTGRES_PASSWORD: vanika
          POSTGRES_DB: vanika_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vanika -d vanika_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://vanika:vanika@localhost:5432/vanika_test
      JWT_SECRET: ci-test-secret-only-for-validation
      GEMINI_API_KEY: ci-placeholder-key-for-testing
      PORT: 5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy

      - name: TypeScript validation
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Build frontend and backend production bundles
        run: npm run build
